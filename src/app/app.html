<header>
  <h1>{{ title }}</h1>
</header>

<main>
  <!-- NOUVEAU : le bandeau rouge, SEULEMENT s'il y a un message.
       @if (store.error(); as message) = "si error() a une valeur, appelle-la 'message' dans ce bloc".
       Un texte = vrai, null = faux → pas d'erreur, pas de bandeau.
       role="alert" : un lecteur d'écran l'annonce dès qu'il apparaît. -->
  @if (store.error(); as message) {
    <div class="error" role="alert">
      <span>{{ message }}</span>
      <!-- Relance le chargement (utile après avoir relancé le serveur). -->
      <button type="button" class="button" (click)="store.load()">Recharger les listes</button>
      <!-- Ferme juste le bandeau. -->
      <button type="button" class="close" title="Fermer le message" aria-label="Fermer le message"
              (click)="store.clearError()">✕</button>
    </div>
  }

  <!-- Le formulaire "nouvelle liste" : identique. -->
  <form class="new-list" (ngSubmit)="createList()">
    <input
      type="text"
      class="field"
      name="name"
      placeholder="Nom de la nouvelle liste"
      aria-label="Nom de la nouvelle liste"
      maxlength="100"
      [ngModel]="newListName()"
(ngModelChange)="newListName.set($event)"
    />
    <button type="submit" class="button" [disabled]="!newListName().trim()">Créer la liste</button>
  </form>

  <!-- NOUVEAU : pendant le chargement, un message À LA PLACE des cartes. -->
  @if (store.loading()) {
    <p class="empty">Chargement des listes…</p>
  } @else {
    <div class="lists">
      @for (list of store.lists(); track list.id) {
        <app-list-card
          [list]="list"
          (addTask)="store.addTask(list, $event)"
          (toggleTask)="store.toggleTask(list, $event)"
          (deleteTask)="store.deleteTask(list, $event)"
          (deleteList)="deleteList(list)"
        />
      } @empty {
        <!-- NOUVEAU : en cas d'erreur, le tableau est vide… mais dire "Aucune liste" serait FAUX :
             il y en a peut-être, on n'a juste pas pu les lire. Donc on ne l'affiche que s'il n'y a PAS d'erreur. -->
        @if (!store.error()) {
          <p class="empty">Aucune liste pour l'instant. Créez-en une avec le formulaire ci-dessus.</p>
        }
      }
    </div>
  }
</main>
